name: CI

on:
  push:
    tags: ['v*']

jobs:
  package:
    name: Package .plasmoid
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Package plasmoid (mirrors kpackagetool6 --pack over project root)
        run: |
          zip -r "dynamic-island-${{ steps.version.outputs.version }}.plasmoid" \
            contents metadata.json LICENSE README.md assets -x ".github/*"

      - name: Show artifact
        run: ls -la *.plasmoid

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dynamic-island-*.plasmoid
