name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run parser and text tests
        run: |
          node tests/network-state.test.cjs
          node tests/text-utils.test.cjs

      - name: Install QML linter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      - name: Lint QML and JavaScript
        run: |
          # Ubuntu installs Qt 6 tools under /usr/lib/qt6/bin instead of putting
          # them on PATH like most distributions do.
          export PATH="/usr/lib/qt6/bin:$PATH"
          command -v qmllint
          qmllint contents/ui/*.qml contents/ui/*.js \
            contents/ui/activities/*.qml \
            contents/ui/controlcenter/*.qml contents/ui/controlcenter/*.js

      - name: Build and validate package
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh
          unzip -t dynamic-island-*.plasmoid

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%-alpha}"
          metadata_version="$(python3 -c 'import json; print(json.load(open("metadata.json"))["KPlugin"]["Version"])')"
          if [ "$base_version" != "$metadata_version" ]; then
              echo "Tag version $base_version does not match metadata.json version $metadata_version" >&2
              exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          if [[ "$tag_version" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package plasmoid
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh "${{ steps.version.outputs.version }}"
          unzip -t dynamic-island-*.plasmoid

      - name: Show artifact
        run: ls -la *.plasmoid

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dynamic-island-*.plasmoid
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
